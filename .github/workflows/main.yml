name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flex-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCTION_HOST: 8.222.215.56
      PRODUCTION_USER: flex-deploy
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure pinned SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and deploy tested release
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/$RELEASE_SHA.tar.gz" "$RELEASE_SHA"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$RUNNER_TEMP/$RELEASE_SHA.tar.gz" \
            "$PRODUCTION_USER@$PRODUCTION_HOST:/opt/flex/incoming/$RELEASE_SHA.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "sudo /usr/local/sbin/flex-deploy-release $RELEASE_SHA"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
