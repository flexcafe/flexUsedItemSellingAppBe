map $http_upgrade $flex_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name api.flexusedmarket.com;
    client_max_body_size 25m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:7879;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Only one trusted proxy hop; ignore client-supplied forwarded chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $flex_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}