map $http_upgrade $flex_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name api.flexusedmarket.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name api.flexusedmarket.com;
    ssl_certificate /etc/letsencrypt/live/api.flexusedmarket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.flexusedmarket.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FlexSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:7879;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $flex_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}